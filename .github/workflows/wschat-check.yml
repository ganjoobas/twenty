name: WSChat check

on:
  workflow_dispatch:
  push:
    branches:
      - 'wschat/**'

permissions:
  contents: read

concurrency:
  group: wschat-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  BRIDGE_DIR: src/engine/core-modules/wschat-bridge
  # Front files changed by the fork (embedding host links, hidden features, pinned Salesfarce)
  FRONT_FILES: >-
    src/modules/ui/field/display/utils/postLinkToEmbeddingHost.ts
    src/modules/ui/field/display/utils/handleEmbeddingHostLinkClick.ts
    src/modules/ui/field/display/utils/__tests__/handleEmbeddingHostLinkClick.test.ts
    src/modules/object-record/record-field/ui/meta-types/display/components/LinksFieldDisplay.tsx
    src/modules/object-record/record-field/ui/hooks/useGetSecondaryFieldButton.ts
    src/modules/wschat/constants/WschatHiddenFeatures.ts
    src/modules/wschat/utils/wschatSalesfarcePin.ts
    src/modules/wschat/utils/__tests__/wschatSalesfarcePin.test.tsx
    src/modules/salesfarce/states/salesfarceIsActiveState.ts
    src/modules/salesfarce/utils/salesfarceEnter.ts
    src/modules/workspace-member/hooks/useColorScheme.ts
    src/pages/settings/profile/appearance/components/SettingsAppearanceOption.tsx
    src/pages/settings/profile/SettingsProfile.tsx
    src/pages/settings/ai/SettingsAI.tsx
    src/modules/app/components/SettingsRoutes.tsx
    src/modules/settings/hooks/useSettingsNavigationItems.tsx
    src/modules/navigation/components/MultiWorkspaceDropdown/internal/MultiWorkspaceDropdownDefaultComponents.tsx

jobs:
  check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      # The image build uses swc without typecheck, so this is the only place types are checked.
      # twenty-server's workspace deps, plus twenty-sdk: scripts/build-seed-front-components.ts imports its build output.
      - name: Build server dependencies
        run: npx nx run-many -t build -p twenty-shared twenty-emails twenty-client-sdk twenty-oxlint-rules twenty-sdk

      # Direct tsgo instead of nx typecheck: nx cache can serve a stale pass.
      - name: Typecheck twenty-server
        working-directory: packages/twenty-server
        run: npx tsgo -p tsconfig.json --noEmit

      - name: Unit tests (wschat-bridge)
        working-directory: packages/twenty-server
        run: npx jest "$BRIDGE_DIR" --config=jest.config.mjs --ci

      - name: Lint (wschat-bridge)
        working-directory: packages/twenty-server
        run: |
          npx oxlint --type-aware -c .oxlintrc.json "$BRIDGE_DIR"
          npx oxfmt --check "$BRIDGE_DIR"

      # Same ^build dependencies as upstream's twenty-front typecheck target (ci-front.yaml)
      - name: Build front dependencies
        run: npx nx run-many -t build -p twenty-ui twenty-front-component-renderer

      - name: Typecheck twenty-front
        working-directory: packages/twenty-front
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: npx tsgo -p tsconfig.json --noEmit

      - name: Unit tests (front, fork files)
        working-directory: packages/twenty-front
        run: |
          cp .env.example .env
          npx jest \
            src/modules/ui/field/display/utils/__tests__/handleEmbeddingHostLinkClick.test.ts \
            src/modules/wschat/utils/__tests__/wschatSalesfarcePin.test.tsx \
            src/pages/settings/profile/appearance/components/__tests__/SalesfarceSettingsAppearance.test.tsx \
            src/modules/salesfarce/utils/__tests__/salesfarceConsumeRequest.test.ts \
            src/modules/settings/hooks/__tests__/useSettingsNavigationItems.test.tsx \
            --config=jest.config.mjs --ci

      - name: Lint (front, fork files)
        working-directory: packages/twenty-front
        run: |
          # shellcheck disable=SC2086
          npx oxlint --type-aware -c .oxlintrc.json $FRONT_FILES
          npx oxfmt --check $FRONT_FILES
